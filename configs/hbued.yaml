dataset:
  name: "HBUED"
  num_subjects: 50
  sampling_rate: 128
  num_channels: 32
  num_classes: 2

psp:
  shifted_window: 20
  patch_size: 40

model:
  latent_dim: 200
  encoder_layers: 3
  attn_heads: 4
  mlp_dim: 32
  dropout: 0.1

training:
  batch_size: 64
  learning_rate: 0.0001
  epochs: 1000
  optimizer: "Adam"
  loss_function: "CrossEntropyLoss"
  holdout_split: [0.60, 0.20, 0.20]
