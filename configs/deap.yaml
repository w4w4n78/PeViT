dataset:
  name: "DEAP"
  num_subjects: 32
  sampling_rate: 200
  num_channels: 32
  num_classes: 2 # Valence / Arousal binary classification

psp:
  shifted_window: 16
  patch_size: 32

model:
  latent_dim: 128
  encoder_layers: 3
  attn_heads: 4
  mlp_dim: 32
  dropout: 0.1

training:
  batch_size: 64
  learning_rate: 0.0001
  epochs: 300
  optimizer: "Adam"
  loss_function: "CrossEntropyLoss"
  holdout_split: [0.60, 0.20, 0.20]
