dataset:
  name: "DREAMER"
  num_subjects: 23
  sampling_rate: 128
  num_channels: 14
  num_classes: 2

psp:
  shifted_window: 16
  patch_size: 32

model:
  latent_dim: 128
  encoder_layers: 3
  attn_heads: 4
  mlp_dim: 64
  dropout: 0.1

training:
  batch_size: 64
  learning_rate: 0.0001
  epochs: 10000
  optimizer: "Adam"
  loss_function: "CrossEntropyLoss"
  holdout_split: [0.60, 0.20, 0.20]
