dataset:
  name: "SEED"
  num_subjects: 15
  sampling_rate: 128
  num_channels: 62
  num_classes: 3 # Positive, Neutral, Negative

psp:
  shifted_window: 20
  patch_size: 40

model:
  latent_dim: 200
  encoder_layers: 6
  attn_heads: 8
  mlp_dim: 64
  dropout: 0.1

training:
  batch_size: 64
  learning_rate: 0.0001
  epochs: 700
  optimizer: "Adam"
  loss_function: "CrossEntropyLoss"
  holdout_split: [0.60, 0.20, 0.20]
